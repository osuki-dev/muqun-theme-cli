name: Release

# Same shape as osuki-dev/react-native-ssh: a push to main is not a release.
# With changesets pending, the cheap `version` job opens/updates the "Version
# Packages" PR. Once that PR is merged (no changesets left, package.json carries
# the new version), the `publish` job builds the bundle and publishes to npm
# with trusted publishing. Any other push to main (docs, CI tweaks, a version
# already on npm) ends after the cheap job.
#
# Bun builds and tests; Node is here only because trusted publishing needs the
# npm CLI (11.5.1 or newer), and changesets runs on Node.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    name: Version PR or decide to publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # commit the version bump
      pull-requests: write # open the "Version Packages" PR
    outputs:
      publish: ${{ steps.decide.outputs.publish }}
      version: ${{ steps.decide.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # changesets diffs against the base branch
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun ci

      - name: Open or update the version PR
        id: changesets
        uses: changesets/action@v1
        with:
          version: bun run version:packages
          # No `publish` here: publishing happens in the job below.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Decide whether this push is a release
        id: decide
        run: |
          VERSION="$(bun -p "require('./package.json').version")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ "${{ steps.changesets.outputs.hasChangesets }}" = "true" ]; then
            echo "changesets pending → version PR only"; echo "publish=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "$VERSION" = "0.0.0" ]; then
            echo "placeholder version → nothing to publish"; echo "publish=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if bun pm view "@osuki-dev/muqun-theme@$VERSION" version >/dev/null 2>&1; then
            echo "$VERSION is already on npm"; echo "publish=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "publishing $VERSION"; echo "publish=true" >> "$GITHUB_OUTPUT"

  publish:
    name: Build and publish
    needs: version
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # push the release tag
      id-token: write # npm trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      # Deliberately no `registry-url` (see osuki-dev/kit: an empty authToken
      # in .npmrc would beat OIDC).
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Use an npm that supports trusted publishing
        run: npm install -g npm@^11.5.1
      - run: bun ci

      - name: Verify before releasing
        run: |
          bun run typecheck
          bun test src
          bun run build
          bun run smoke

      - name: Publish ${{ needs.version.outputs.version }}
        # npm cannot attest provenance for a private repository, and passing
        # the flag there fails the publish outright (E422). Trusted publishing
        # itself works from a private repo; only the attestation is gated.
        # Making the repository public turns provenance on with no edit here.
        env:
          NPM_CONFIG_PROVENANCE: ${{ github.event.repository.private == false }}
        run: |
          npm --version
          echo "provenance: $NPM_CONFIG_PROVENANCE"
          bun run release:packages
          echo "published: $(bun pm view "@osuki-dev/muqun-theme@${{ needs.version.outputs.version }}" version)"

      - name: Tag
        # After a successful publish, not before, so a tag always means a
        # version that actually reached npm.
        run: |
          git tag "v${{ needs.version.outputs.version }}"
          git push origin "v${{ needs.version.outputs.version }}"

      - name: GitHub release
        # Notes come from the CHANGELOG section changesets wrote for this version.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          bash scripts/release-notes.sh "$VERSION" > "$RUNNER_TEMP/notes.md"
          printf '\n\nnpm: https://www.npmjs.com/package/@osuki-dev/muqun-theme/v/%s\n' "$VERSION" >> "$RUNNER_TEMP/notes.md"
          gh release create "v$VERSION" --title "v$VERSION" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag
